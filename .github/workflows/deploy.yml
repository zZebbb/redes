name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # todo dia às 6h (horário de Brasília)
    - cron: "*/10 * * * *" # durante o encontro: a cada 10 min, para as fotos novas do Drive aparecerem logo

permissions:
  contents: write # para guardar no repositório os PDFs copiados do Drive
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Baixar planilha
        run: npm run sync
        env:
          PLANILHA_CSV_URL: ${{ vars.PLANILHA_CSV_URL }}
      - name: Copiar PDFs novos do Drive para o site
        run: npm run pdfs
      - name: Copiar fotos novas do Drive para o site
        run: npm run fotos
      - name: Guardar os PDFs e as fotos no repositório
        run: |
          if [ -n "$(git status --porcelain pdfs fotos data/fotos.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pdfs fotos data/fotos.csv
            git commit -m "Copia PDFs e fotos novos do Drive"
            git pull --rebase --autostash -q || true
            git push
          fi
      - name: Instalar pdftoppm (imagens da pré-visualização para iPhone)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
